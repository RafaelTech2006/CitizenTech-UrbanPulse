<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>UrbanPulse - Formulário de Ocorrência</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-4">Cadastro de Ocorrência</h3>

          <form th:action="${acao != null} ? ${acao} : @{/ocorrencias}" method="post">

            <div class="mb-3">
              <label for="titulo" class="form-label">Título</label>
              <input type="text" class="form-control" id="titulo" name="titulo" th:value="${ocorrencia?.titulo}" required>
            </div>

            <div class="mb-3">
              <label for="categoria" class="form-label">Categoria</label>
              <input type="text" class="form-control" id="categoria" name="categoria" th:value="${ocorrencia?.categoria}" required>
            </div>

            <div class="mb-3">
              <label for="descricao" class="form-label">Descrição</label>
              <textarea class="form-control" id="descricao" name="descricao" rows="3" th:text="${ocorrencia?.descricao}" required></textarea>
            </div>

            <div class="mb-3">
              <label for="endereco" class="form-label">Endereço</label>
              <input type="text" class="form-control" id="endereco" name="endereco" th:value="${ocorrencia?.endereco}" required>
            </div>

            <div class="mb-3">
              <label for="fotoAntesUrl" class="form-label">URL da Foto</label>
              <input type="text" class="form-control" id="fotoAntesUrl" name="fotoAntesUrl" th:value="${ocorrencia?.fotoAntesUrl}">
            </div>

            <div class="mb-3">
              <label for="usuarioCodigo" class="form-label">Cidadão / Autor</label>
              <select class="form-select" id="usuarioCodigo" name="usuarioCodigo" required>
                <option value="">Selecione o usuário...</option>
                <option th:each="u : ${usuarios}"
                        th:value="${u.codigo}"
                        th:text="${u.nome}"
                        th:selected="${ocorrencia != null and ocorrencia.usuario != null and ocorrencia.usuario.codigo == u.codigo}">
                </option>
              </select>
            </div>

            <div class="d-flex justify-content-between">
              <a href="/ocorrencias" class="btn btn-secondary">Cancelar</a>
              <button type="submit" class="btn btn-success">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
