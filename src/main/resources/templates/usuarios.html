<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>UrbanPulse - Lista de Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestão de Usuários</h2>
    <div>
      <a href="/" class="btn btn-outline-secondary me-2">Início</a>
      <a href="/usuarios/novo" class="btn btn-primary">Novo Usuário</a>
      <a href="/ocorrencias" class="btn btn-secondary">Ocorrências</a>
      <a href="/acompanhamentos" class="btn btn-info text-white">Acompanhamentos</a>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
          <th>Código</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Pontos</th>
          <th class="text-center">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.codigo}">1</td>
          <td th:text="${u.nome}">Nome</td>
          <td th:text="${u.email}">email@email.com</td>
          <td th:text="${u.pontosEngajamento}">0</td>
          <td class="text-center">
            <a th:href="@{/usuarios/editar/{codigo}(codigo=${u.codigo})}" class="btn btn-sm btn-warning">Editar</a>
            <a th:href="@{/usuarios/excluir/{codigo}(codigo=${u.codigo})}" class="btn btn-sm btn-danger" onclick="return confirm('Deseja realmente excluir este usuário?')">Excluir</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
